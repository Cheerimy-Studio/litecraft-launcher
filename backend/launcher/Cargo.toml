[package]
name = "litecraft-launther"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "LiteCraft Launther: downloads Minecraft 26.3 from public sources, prepares LiteCraft's resources and starts the game"

# The launcher is its own workspace: the game's build never waits for the GUI stack.
[workspace]

[[bin]]
name = "litecraft-launther"
path = "src/main.rs"

[dependencies]
# Immediate-mode UI: one window, no web view, no GPU compute. glow keeps the build small and works
# on the same machines the game's OpenGL fallback does.
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mojang's metadata is fetched and checked in the same process: no bundled game files.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha1 = "0.10"
sha2 = "0.10"
# A prepared resource pack can be installed from a GitHub release (zip).
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
dirs = "5"
# In-process resource preparation: the same crate the game's tools use.
horizon-prepare = { path = "../horizon-prepare" }

[build-dependencies]
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
opt-level = 2
