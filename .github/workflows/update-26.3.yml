name: Update 26.3 manifest

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh manifest
        run: python tools/update_26.3_manifest.py
      - name: Commit
        run: |
          git config user.name "litecraft-bot"
          git config user.email "litecraft-bot@users.noreply.github.com"
          git add manifests/26.3.json
          git diff --cached --quiet || git commit -m "Update 26.3 manifest"
          git push
